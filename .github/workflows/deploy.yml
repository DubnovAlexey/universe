# ============================================================================
# ФАЙЛ: .github/workflows/deploy.yml
# НАЗНАЧЕНИЕ: Верификация полиглот-ядра, сборка Rust/WASM и публикация GitHub Pages.
# ФУНКЦИИ: Проверки Python, Rust, WASM и TypeScript; сборка и доставка Pages-артефакта.
# ОГЛАВЛЕНИЕ РАЗДЕЛОВ:
#   1. События запуска, разрешения и окружение workflow.
#   2. Верификация исходников и сборка Pages-артефакта.
#   3. Публикация проверенного артефакта на GitHub Pages.
# ============================================================================

# ============================================================================
# РАЗДЕЛ 1. СОБЫТИЯ ЗАПУСКА, РАЗРЕШЕНИЯ И ОКРУЖЕНИЕ WORKFLOW
# ============================================================================

name: Deploy UNIVERSE to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ============================================================================
  # РАЗДЕЛ 2. ВЕРИФИКАЦИЯ ИСХОДНИКОВ И СБОРКА PAGES-АРТЕФАКТА
  # ============================================================================
  build-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22 (Astro-compatible patch)
        uses: actions/setup-node@v7
        with:
          # Исключает старые patch-релизы из кэша runner: Astro требует >=22.23.4.
          node-version: "^22.23.4"

      - name: Verify Repository Source Completeness
        run: npm run verify:repo

      - name: Setup Python 3.11 for Backend Parity Verification
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify Python Core Golden PRNG, NEXUS Topology & Binary Packet Parity
        run: python -B -m backend.main --verify

      - name: Run Python Backend Unit Tests
        run: python -B -m unittest discover -v

      - name: Setup Rust Toolchain for Physics Crate Verification
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run Rust Symplectic Physics Unit Tests
        working-directory: ./physics_engine
        run: cargo test --locked

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Build and Validate Raw Rust WebAssembly ABI v1
        run: npm run build:wasm

      - name: Verify Browser WebAssembly Runtime and TypeScript Parity
        run: npm run verify:wasm

      - name: TypeScript Strict Typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: Run Universe Verification & Regression Suite
        working-directory: ./frontend
        run: npm test

      - name: Build Astro Production Bundle for GitHub Pages
        working-directory: ./frontend
        env:
          NODE_ENV: production
        run: npm run build

      - name: Verify GitHub Pages Artifact Paths and Entry Points
        working-directory: ./frontend
        run: npm run verify:pages-artifact

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./frontend/dist

  # ============================================================================
  # РАЗДЕЛ 3. ПУБЛИКАЦИЯ ПРОВЕРЕННОГО АРТЕФАКТА НА GITHUB PAGES
  # ============================================================================
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build-and-verify
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
