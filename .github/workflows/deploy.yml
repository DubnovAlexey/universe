# ============================================================================
# ФАЙЛ: .github/workflows/deploy.yml
# НАЗНАЧЕНИЕ: Автоматическая верификация полиглот-ядра (Python + Rust + TS),
#             прогон 11 регрессионных тестов и деплой на GitHub Pages
# ============================================================================

name: Deploy UNIVERSE to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11 for Backend Parity Verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python Core Golden PRNG, NEXUS Topology & Binary Packet Parity
        run: python -B -m backend.main --verify

      - name: Setup Rust Toolchain for Physics Crate Verification
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Rust Symplectic Physics Crate Compilation
        working-directory: ./physics_engine
        run: cargo check

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: TypeScript Strict Typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: Run Universe Verification & Regression Suite
        working-directory: ./frontend
        run: npm test

      - name: Build Astro Production Bundle for GitHub Pages
        working-directory: ./frontend
        env:
          NODE_ENV: production
        run: npm run build

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build-and-verify
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4