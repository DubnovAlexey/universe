# ==============================================================================
# ФАЙЛ: physics_engine/Cargo.toml
# НАЗНАЧЕНИЕ: Манифест нативной проверки и raw WebAssembly-библиотеки физики.
# ОГЛАВЛЕНИЕ:
# 1. Метаданные пакета.
# 2. Тип библиотеки C ABI.
# 3. Внешние зависимости.
# ==============================================================================

# --- НАЧАЛО РАЗДЕЛА 1: МЕТАДАННЫЕ ---
[package]
name = "physics_engine"
version = "0.1.0"
edition = "2021"
description = "Wasm bridge and stress solver for the Truth universe"
authors = ["Alexey"]
# --- КОНЕЦ РАЗДЕЛА 1: МЕТАДАННЫЕ ---

# Настраиваем компилятор так, чтобы он создал динамическую библиотеку (C-совместимую),
# которая легко превратится в WebAssembly модуль для браузера.
# --- НАЧАЛО РАЗДЕЛА 2: C ABI БИБЛИОТЕКА ---
[lib]
crate-type = ["cdylib"]
# --- КОНЕЦ РАЗДЕЛА 2: C ABI БИБЛИОТЕКА ---

# Raw C ABI needs no wasm-bindgen JavaScript glue or external dependencies.
# --- НАЧАЛО РАЗДЕЛА 3: ЗАВИСИМОСТИ ---
[dependencies]
# --- КОНЕЦ РАЗДЕЛА 3: ЗАВИСИМОСТИ ---
