# ==============================================================================
# ФАЙЛ: physics_engine/Cargo.toml
# НАЗНАЧЕНИЕ: Манифест физического движка на Rust. Описывает зависимости
# и правила компиляции для WebAssembly.
# ==============================================================================

[package]
name = "physics_engine"
version = "0.1.0"
edition = "2021"
description = "Wasm bridge and stress solver for the Truth universe"
authors = ["Alexey"]

# Настраиваем компилятор так, чтобы он создал динамическую библиотеку (C-совместимую),
# которая легко превратится в WebAssembly модуль для браузера.
[lib]
crate-type = ["cdylib"]

# Внешние библиотеки, которые нам нужны для работы
[dependencies]
# Инструмент для связи Rust и JavaScript
wasm-bindgen = "0.2"
# Дает доступ к встроенным функциям JS (например, Math.random или массивам)
js-sys = "0.3"